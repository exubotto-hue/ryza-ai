name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fian222's repo (has .sh scripts)
        uses: actions/checkout@v4
        with:
          repository: Fian222/ryza-ai-revive
          ref: master

      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y curl wget tar unzip

      - name: Setup Android tools
        run: |
          chmod +x scripts/setup_android_tools.sh
          ./scripts/setup_android_tools.sh

      - name: Build APK
        run: |
          chmod +x scripts/build_apk.sh
          ./scripts/build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RyzaChat-apk
          path: output/android/*.apk
