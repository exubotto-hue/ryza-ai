name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: List scripts (sanity check)
        run: dir scripts

      - name: Setup Android tools (JDK17 + SDK34)
        run: powershell -File scripts/setup_android_tools.ps1

      - name: Build APK
        run: powershell -File scripts/build_apk.ps1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyzaChat-apk
          path: output\android\*.apk
