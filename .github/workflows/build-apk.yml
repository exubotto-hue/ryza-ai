name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install deps (curl/wget, tar, unzip)
        run: sudo apt-get update && sudo apt-get install -y curl wget tar unzip

      - name: Setup Android tools (JDK17 + SDK34, project-local)
        run: |
          chmod +x scripts/setup_android_tools.sh
          ./scripts/setup_android_tools.sh

      - name: Build APK
        run: |
          chmod +x scripts/build_apk.sh
          ./scripts/build_apk.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyzaChat-apk
          path: output/android/*.apk
