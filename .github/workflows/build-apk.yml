jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android tools
        run: powershell -File scripts/setup_android_tools.ps1

      - name: Build APK
        run: powershell -File scripts/build_apk.ps1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyzaChat-apk
          path: output\android\*.apk
